[package]
name = "drive"
version = "0.1.0"
edition = "2024"
description = "The one way to check, test, document and bench a Cargo workspace"
publish = false

# Its own workspace: a project holds this crate as a submodule, outside its own workspace, so the
# driver's build never touches the project's cache.
[workspace]

[dependencies]
# No color or suggestions: crates that only dress up the help text, which agents read plain.
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Warn, not deny: the verification chain runs clippy with `-D warnings`.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
inline_always = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
unchecked_time_subtraction = "allow"
struct_field_names = "allow"
match_same_arms = "allow"
unused_self = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_underscore = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
deref_by_slicing = "warn"
derive_partial_eq_without_eq = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
equatable_if_let = "warn"
exit = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
imprecise_flops = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
iter_with_drain = "warn"
large_include_file = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
missing_const_for_fn = "warn"
mixed_read_write_in_expression = "warn"
module_name_repetitions = "warn"
mutex_atomic = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
negative_feature_names = "warn"
non_zero_suggestions = "warn"
or_fun_call = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_feature_names = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
self_named_module_files = "warn"
string_lit_chars_any = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
try_err = "warn"
type_repetition_in_bounds = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"
